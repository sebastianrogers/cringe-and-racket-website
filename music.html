<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4EBDD">
  <meta name="description" content="Discover the songs and musical style of Cringe & Racket.">
  <title>Cringe &amp; Racket | Music</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Cringe and Racket home">
        <img class="crest" src="images/crest-walnut.png" alt="Cringe and Racket Victorian hat crest" width="170" height="170">
        <span class="brand-copy"><span class="brand-name">Cringe <span class="amp">&amp;</span> Racket</span><span class="tagline">Musical Entertainment of a Questionable Vintage</span></span>
      </a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation menu"><span></span><span></span><span></span></button>
      <nav class="navigation" id="primary-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="music.html" aria-current="page">Music</a>
        <a href="gigs.html">Gigs</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
        <a href="ramblings.html">Ramblings</a>
      </nav>
    </div>
  </header>
  <main class="page-content" id="main-content">
    <p class="eyebrow">Songs and sounds</p>
    <h1>Music</h1>
    <img class="ornamental-divider" src="images/divider.svg" alt="" width="440" height="25">
    <p class="intro">Banjos, songs and a little theatrical nonsense: the sound of Cringe &amp; Racket is made for an evening with a decidedly questionable vintage.</p>
  </main>
  <script>
    const toggle = document.querySelector('.menu-toggle');
    const nav = document.querySelector('#primary-nav');
    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      toggle.setAttribute('aria-label', open ? 'Open navigation menu' : 'Close navigation menu');
      nav.classList.toggle('is-open', !open);
    });
  </script>
</body>
</html>
